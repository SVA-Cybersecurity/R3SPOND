index:
  description: |
    R3SPOND stands for _Readiness, Response and Recovery – Security Procedure Organization and Navigation Device_.
    It is a framework that aggregates and structures technical and organizational measures taken to respond to security incidents.
    Regarding content R3SPOND is based on the NIST incident response lifecycle, but extends the model by stretching out the original four phases and enriching them with practical steps that can be used checklist like.
    Complementary to the technical aspects additional phases like *Initial crisis meeting*, *Internal Communication* and *Negotiation over ransom* cover organizational measures and topics that need to be taken into account.
    With a total of 16 phases the framework covers the incident response process from preparation to incident closure and follow-up and can serve as a general guide for orientation in incident management; however, due to the uniqueness of each IT security incident, a project-specific implementation of the measures is required.
  flowchart: ../../assets/images/en/r3spond_flowchart.png
  matrix:
    toolbar:
