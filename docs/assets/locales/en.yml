material_references:
  reporting_obligations:
    table_content: |
      | Reporting obligation under | Affected organizations                                                                                              | Reporting authority         | Initial report deadline | Follow-up reports                                                                 |
      |----------------------------|----------------------------------------------------------------------------------------------------------------------|-----------------------------|-------------------------|-----------------------------------------------------------------------------------|
      | GDPR                       | all organizations processing data                                                                                   | State Data Protection Authority | 72 h                    |                                                                                   |
      | BSIG                       | critical infrastructure operators, digital service providers (online marketplaces, online search engines, cloud computing services) | BSI                         | 24 h                    | Update: 72 h, interim reports: upon request by the BSI, final report: 1 month   |
      | NIS2                       | critical infrastructure operators                                                                                    | BSI                         | 24 h                    |                                                                                   |
      | DORA                       | financial service providers                                                                                          | BaFin                       | 24 h                    | Follow-up report: 72 h, final report: 1 month                                    |
      | TKG                        | telecommunications and telemedia providers                                                                           | BSI, Federal Network Agency | 24 h                    | Follow-up report: 72 h                                                           |
      | eIDAS Regulation           | trust service providers                                                                                              | BSI                         | 24 h                    |                                                                                   |
      | ZAG                        | payment service providers                                                                                            | BaFin                       | without undue delay     |                                                                                   |
      | State law                  | generally municipal administrations (state-specific!)                                                                | state-specific              | generally without undue delay |                                                                              |
    disclaimer:
      title: "Attention"
      description: |
        The table shows reporting obligations and authorities in Germany.
        Different or additional country-specific regulations may apply to locations abroad!
