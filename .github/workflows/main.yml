name: Build MkDocs

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: python:3.11

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build MkDocs
        run: |
          mkdocs build -d site

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: R3SPOND Incident Response Framework
          path: |
            site/
            R3SPOND_START.html
